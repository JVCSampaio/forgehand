<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Fredoka One', 'Noto Color Emoji', sans-serif; background: #2a1540; }
  /* Four slanted slices; each panel is shifted so its tower sits mid-slice. */
  .panel { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background-size: 1920px 1080px; background-repeat: no-repeat; }
  .divider { position: absolute; top: -40px; width: 16px; height: 1160px; background: #2a1540; transform: skewX(-7.9deg); }
  .title { position: absolute; left: 50%; top: 36px; transform: translateX(-50%) rotate(-3deg); font-size: 112px; white-space: nowrap;
    background: linear-gradient(180deg, #fff6b0 0%, #ffd23c 45%, #ff9a1e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 10px #2a1540; paint-order: stroke fill; filter: drop-shadow(0 10px 0 #2a1540) drop-shadow(0 18px 24px rgba(0,0,0,0.45)); }
  .label { position: absolute; bottom: 50px; font-size: 50px; color: #fff; -webkit-text-stroke: 8px #2a1540; paint-order: stroke fill;
    filter: drop-shadow(0 6px 0 #2a1540); white-space: nowrap; transform: translateX(-50%) rotate(-3deg); }
</style>
</head>
<body>
  <div class="panel" style="background-image:url(out/panel-Stackville.png); background-position-x: -700px; clip-path: polygon(0 0, 520px 0, 370px 1080px, 0 1080px)"></div>
  <div class="panel" style="background-image:url(out/panel-Frostpeak.png); background-position-x: -250px; clip-path: polygon(520px 0, 994px 0, 844px 1080px, 370px 1080px)"></div>
  <div class="panel" style="background-image:url(out/panel-CandyCoast.png); background-position-x: 230px; clip-path: polygon(994px 0, 1468px 0, 1318px 1080px, 844px 1080px)"></div>
  <div class="panel" style="background-image:url(out/panel-NeonCity.png); background-position-x: 700px; clip-path: polygon(1468px 0, 1920px 0, 1920px 1080px, 1318px 1080px)"></div>
  <div class="divider" style="left: 437px"></div>
  <div class="divider" style="left: 911px"></div>
  <div class="divider" style="left: 1385px"></div>
  <div class="title">KEEP GOING!</div>
  <div class="label" style="left: 200px">🏘️ Stackville</div>
  <div class="label" style="left: 640px">🏔️ Frostpeak</div>
  <div class="label" style="left: 1110px">🍭 Candy Coast</div>
  <div class="label" style="left: 1640px">🌃 Neon City</div>
  <script>document.fonts.ready.then(() => { document.title = 'ready'; });</script>
</body>
</html>
